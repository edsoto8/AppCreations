[project]
name = "termdeck"
version = "0.1.0"
description = "A showcase of modern TUI building blocks, built with Textual"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["textual>=8.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
termdeck = "termdeck.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["termdeck"]

[tool.setuptools.package-data]
termdeck = ["*.tcss"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
